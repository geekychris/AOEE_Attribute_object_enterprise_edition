server:
  port: 8080

aoee:
  host: localhost
  port: 50051
  
  # Persistence configuration
  persistence:
    enabled: false  # Set to true to enable write-through to persistence
    url: http://localhost:8081
    write-through: true  # Write edges to persistence on add/delete
    warm-on-startup: false  # Load edges from persistence on startup

spring:
  application:
    name: aoee-spring

logging:
  level:
    com.aoee.spring: INFO
    com.aoee.spring.persistence: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
