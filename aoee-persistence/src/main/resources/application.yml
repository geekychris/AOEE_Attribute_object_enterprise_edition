server:
  port: 8081

spring:
  application:
    name: aoee-persistence

  # Default to H2 for development
  datasource:
    url: jdbc:h2:file:./data/aoee;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    path: /graphql
    schema:
      printer:
        enabled: true

logging:
  level:
    com.aoee.persistence: DEBUG
    org.springframework.graphql: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

---
# PostgreSQL profile
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/aoee
    driver-class-name: org.postgresql.Driver
    username: aoee
    password: aoee

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: false
